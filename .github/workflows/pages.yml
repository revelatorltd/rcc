name: Publish RCC

# One site for the repository: main, at its root. Any push to main rebuilds it, so the site always
# shows main as it is now. The design system comes in the vendored archive, so the build needs
# nothing beside this repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer run replaces an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build main
        env:
          APP_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npx tsc -b --noEmit
          npx vite build --outDir _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
